services:
  - type: web
    name: lg-ax-masters-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: AL_CORS_ORIGINS
        value: https://sharethings0987.github.io
      - key: GOV24_SERVICE_KEY
        sync: false
      - key: LH_SERVICE_KEY
        sync: false
      - key: ONTONG_YOUTH_KEY
        sync: false
