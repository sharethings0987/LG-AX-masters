 else if(k=='ff'){G.paused=false;FFN=1;draw();loop()}
 else if(k=='auto'){G.auto=!G.auto;if(G.auto&&G.dec&&!G.dec.hid){const ok=G.dec.e.ch.map((c,i)=>i).filter(i=>!lock(G.dec.e.ch[i]));pickC(ri(ok.length?ok:[0]))}tst(G.auto?'자동 결정 켜짐 — 이제 선택을 알아서 해요':'자동 결정 꺼짐');draw();loop()}
 else if(k=='like'){const p=G.feed.find(x=>x.id==+v);if(p&&!p.liked){p.liked=1;G.fr[p.fi].bond=clf(G.fr[p.fi].bond+2)}draw()}
 else if(k=='cm'){MOD={k:'cm',pid:+v};draw()}else if(k=='cmt')doComment(MOD.pid,v)
 else if(k=='tip'){const p=G.feed.find(x=>x.id==+v);if(p&&p.k){addRum(p.k,G.fr[p.fi].n);const r=G.rumor.find(x=>x.k==p.k);if(r)startSr(r.id)}}
 else if(k=='fst'){const a=G.fr[+v].stories.filter(s=>s.exp>=G.m);if(!a.length)return tst('지금 올라온 스토리가 없어요');const s=a.find(x=>!x.seen)||a[0];MOD={k:'story',sid:s.id};draw()}else if(k=='srep')doStoryReply(MOD.sid,v)
 else if(k=='sans'){const j=v.indexOf(':');answerStory(+v.slice(0,j),+v.slice(j+1))}
 else if(k=='snext'){const l=actS();if(l.length<2){MOD=null;draw();loop();return}const ix=l.findIndex(s=>s.id==MOD.sid);MOD={k:'story',sid:l[(ix+1)%l.length].id};draw()}
 else if(k=='diary'){MOD={k:'diary'};draw()}
 else if(k=='nav'){if(v=='home'){MOD=null;draw();loop()}else{MOD={k:'nav',t:v};draw()}}
 else if(k=='peer'){MOD={k:'peer',i:+v};draw()}
 else if(k=='ping'){const f=G.fr[+v];f.ping=G.m;f.bond=clf(f.bond+6);const tr=ri(TRUE[f.job]);G.sq.push({due:G.m+1,t:`${f.n}에게서 답장이 왔다. 「${tr[0]}」 안부를 묻길 잘했다.`,tone:'g',fx:{soc:4,hp:1},tag:'f',fi:+v,w:2});addLine(`${f.n}에게 안부 메시지를 보냈다.`,'q',null,'c');touch(+v);MOD=null;draw()}
 else if(k=='yr'){MOD={k:'yr',i:+v};draw()}
 else if(k=='mys'){MOD={k:'my',mood:'😊'};draw()}
 else if(k=='mood'){const t=($('mys')||{}).value||'';MOD.mood=v;draw();if($('mys'))$('mys').value=t}
 else if(k=='mysave'){const t=(($('mys')||{}).value||'').trim();if(!t)return tst('한 줄만 적어도 괜찮아요');saveMyStory(t,MOD.mood);MOD=null;draw()}
 else if(k=='close'){MOD=null;draw();loop()}
 else if(k=='srclose'){MOD=null;G.sr=null;draw();loop()}
 else if(k=='ksave'){G.known[v]=1;tst('📌 저장했어요. 대상이 되면 알려드릴게요');MOD=null;draw();loop()}
 else if(k=='srs')startSr(+v);else if(k=='srp')srPick(+v);
 else if(k=='rx'){const r=G.rumor.find(x=>x.id==+v);if(r){G.miss[r.k]=1;G.rumor=G.rumor.filter(x=>x!==r)}draw()}
 else if(k=='pol'){MOD={k:'pol',id:v,got:1};draw()}
 else if(k=='to'){LTO=v;draw()}
 else if(k=='lp'){const t=['고생 많았어.','네 속도로 가도 돼.','몰랐던 게 아니라 아무도 안 알려줬던 거야.'][+v],x=$('ltr');if(x)x.value=(x.value?x.value+' ':'')+t}
 else if(k=='lsave'){const t=(($('ltr')||{}).value||'').trim();if(!t)return tst('한 줄이라도 남겨보세요');const to=LTO=='me'?'5년 뒤의 나에게':`마흔의 ${G.me.n}에게`,L=lettersLocal();L.unshift({to,text:t,date:new Date().toLocaleDateString('ko-KR')});let ok=1;try{localStorage.setItem('al_letters',JSON.stringify(L.slice(0,20)))}catch(er){ok=0}
  if(typeof BE!='undefined')BE.saveLetter(to,t,ok);else tst(ok?'💌 편지를 저장했어요. 처음 화면의 편지함에서 볼 수 있어요':'이 환경에서는 저장되지 않아요. 복사해서 보관해주세요')}
});
window.addEventListener('error',e=>{const a=$('app');if(a)a.insertAdjacentHTML('afterbegin','<div class="pn">오류: '+e.message+'</div>')});
draw();
</script>
