<html lang="ko"><head><meta charset="utf-8">

<title>Another Station</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f3f4f0;--card:#fff;--ink:#1f2a2e;--mu:#7b827c;--ln:#dcdfd8;--ac:#8a1c3b;--g:#1f7a5c;--b:#b3312d;--gd:#b88a1e;color-scheme:light}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "NEXON Lv2 Gothic","Noto Sans KR",sans-serif}
.se{font-family:"NEXON Lv2 Gothic","Noto Sans KR",sans-serif}.mu{color:var(--mu);font-size:12px}.av{image-rendering:pixelated;flex:none}

.tb .ctl{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}

.pn{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:14px;margin-bottom:14px}

.id{border-top:6px solid var(--ac)}.post{display:flex;gap:10px;align-items:flex-start}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:2px 0}.kv b{font-weight:400;color:var(--mu)}
.sb{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.sb label{width:52px;color:var(--mu)}.sb .bar{flex:1;height:8px;background:var(--ln)}.sb .bar i{display:block;height:100%;transition:width .8s}.sb em{width:26px;text-align:right;font-style:normal;font-size:12px}

.ln{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--ln);font-size:14px}.ln .ag{font:12px monospace;color:var(--mu);width:50px;flex:none;padding-top:2px}.ln.g{color:var(--g)}.ln.b{color:var(--b)}.ln.q{font-style:italic;color:var(--ac)}.ln.d{color:var(--mu)}
.ln.new{animation:fi .6s}@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.fe{border-top:1px solid var(--ln);padding-top:8px;margin-top:8px}.ph{height:84px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:38px;margin:6px 0 4px;letter-spacing:4px}
.act{display:flex;gap:6px;margin-top:4px}.act button{border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-size:12px;padding:1px 8px;border-radius:4px;cursor:pointer}.act button.on{background:var(--ac);color:#fff}
.stories{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.stories button{background:none;border:0;color:var(--ink);font:inherit;font-size:11px;cursor:pointer;text-align:center;flex:none}
.ring{display:block;padding:2px;border-radius:50%;background:linear-gradient(135deg,var(--gd),var(--ac));margin-bottom:2px}.ring.old{background:var(--ln)}.ring svg{display:block;border-radius:50%;background:var(--card);border:2px solid var(--card)}.ring.me{background:var(--g)}
.ring .pl{width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--card);border-radius:50%}

.ft{text-align:center;margin:12px 0 0}.ft button{border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-size:12px;padding:5px 12px;border-radius:5px;cursor:pointer}
.bn{border:1px solid var(--ac);color:var(--ac);padding:8px 12px;border-radius:6px;margin-bottom:10px;cursor:pointer;background:var(--card)}
.res{display:block;width:100%;text-align:left;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;padding:8px 10px;margin-top:8px;border-radius:5px;cursor:pointer}.res b{display:block;color:#2a6fd0}.res u{font-size:11px;color:var(--mu);text-decoration:none;word-break:break-all}.res.dead{opacity:.45;text-decoration:line-through;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;font-size:12px;padding:3px 10px;border-radius:14px;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg)}
.btn{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:inherit;font-weight:700;border-radius:6px;cursor:pointer}.btn.sec{background:var(--card);color:var(--ink);border-color:var(--ln)}
textarea{width:100%;min-height:80px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit;padding:8px;border-radius:5px}
.lg{padding:4px 0;border-bottom:1px solid var(--ln);font-size:13px}a{color:#2a6fd0}footer{font-size:11px;color:var(--mu);margin:10px 14px 40px;text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:520px;width:calc(100% - 28px);background:var(--ink);color:var(--bg);padding:8px 12px;font-size:13px;opacity:0;transition:opacity .4s;z-index:40;pointer-events:none;border-radius:6px}
.w{max-width:620px;margin:20px auto;padding:0 14px}
@media (max-width:1000px){.gd{grid-template-columns:1fr}.cc{order:-1}.pbar{width:110px}.tb .ctl{margin-left:0}}
.ag{display:grid;grid-template-columns:minmax(0,520px) 300px;gap:16px;max-width:860px;margin:14px auto;padding:0 14px;justify-content:center}
.bgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px;max-width:1100px;margin:14px auto 0;padding:0 14px}
.bgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;max-width:1100px;margin:0 auto;padding:0 14px}
.only-m{display:none}.mini{align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.ticks{display:flex;gap:2px;flex:1;min-width:120px;max-width:300px}.ticks i{flex:1;height:10px;background:var(--ln);border-radius:2px;cursor:pointer}.ticks i.cur{outline:2px solid var(--ac)}
.pcard{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:10px}
.kd{font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:10px;padding:0 7px}.lnk{background:none;border:0;padding:0;cursor:pointer}
.cmt{font-size:13px;color:var(--mu);margin-top:2px}.cmt b{color:var(--ink);font-weight:500}.cmt.me{color:var(--ac)}
.dcd{background:var(--card);border:2px solid var(--ac);border-radius:10px;padding:14px 16px;margin-bottom:12px}.dcd h3{margin:2px 0 4px;font-size:22px}
.sf{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.bub{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;font-size:14px;max-width:90%}
.sq{font-size:12px;font-style:italic;color:var(--ac);padding:4px 2px}
.sm2{display:flex;gap:10px;background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--ln);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14px}.sm2.g{border-left-color:var(--g)}.sm2.b{border-left-color:var(--b)}.sm2 .em{font-size:18px}
.ln{display:flex;gap:12px;padding:6px 4px;border-bottom:1px solid var(--ln);font-size:14px}.ln .ag2{font:12px monospace;color:var(--mu);width:56px;flex:none;padding-top:2px}
.bdg{display:block;font-size:10px;color:var(--ac)}.ring.dim{opacity:.4}
.chp{margin:8px 0}.chip2{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.chip2 span{width:44px;color:var(--mu)}.chip2 i{flex:1;height:6px;background:var(--ln);display:block}.chip2 b{display:block;height:100%}.chip2 em{width:24px;text-align:right;font-style:normal}
.tbw{position:sticky;top:0;z-index:20}.tbw .tb{position:static}.fs{display:flex;gap:3px;overflow-x:auto;padding:6px 14px;background:var(--card);border-bottom:1px solid var(--ln)}
.fc{flex:1 0 34px;min-width:34px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:5px;padding:2px 0;cursor:pointer;font:inherit}.fc span{display:block;font-size:16px;height:22px}.fc em{display:block;font-style:normal;font-size:10px;color:var(--mu)}.fc.cur{outline:2px solid var(--ac)}.fc.fut{opacity:.45}
.scn{border-radius:10px;padding:18px;min-height:210px;border:1px solid var(--ln);margin-bottom:8px;color:#1f2a2e}.scn .big{font-size:48px;line-height:1.1}.scn .hl{font-size:21px;font-weight:700;line-height:1.5;margin-top:6px}
.scn .dcd{color:var(--ink)}.prevs{margin-bottom:12px}.prev{font-size:13px;color:var(--mu);padding:4px 4px;border-bottom:1px dashed var(--ln)}
@media (max-width:900px){.ag{grid-template-columns:1fr}.only-m{display:flex}.ag aside .id{display:none}.bgrid,.bgrid2{grid-template-columns:1fr}.ticks{max-width:none}}
:root{--bg:#f5f0fb;--card:#fffdff;--ln:#e3d9f0;--ac:#a8467a;--ink:#2b2438;--mu:#7d7490}
@media (prefers-color-scheme:dark){:root{--bg:#1b1724;--card:#252032;--ln:#3a3350;--ac:#e58ab9;--ink:#efeaf8;--mu:#a39bb8}}
body{padding-bottom:84px}
.hm{max-width:1180px;margin:14px auto 0;padding:0 14px}
.hm1{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:14px}
.hm2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:14px;margin-top:14px}
.room{position:relative;height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--ln);background:linear-gradient(#f9e8f1,#f1dff0)}
.room .wall{position:absolute;inset:0 0 28% 0;background:linear-gradient(#fbe9f3,#f3e1f1)}.room .floor{position:absolute;inset:72% 0 0 0;background:#c9a487}
.room .win{position:absolute;left:6%;top:12%;width:36%;height:50%;border:6px solid #fff;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #d9c3dc}
.room .win .sky{position:absolute;inset:0}.room .win svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:55%}
.room .desk{position:absolute;left:38%;right:4%;top:66%;height:8%;background:#8b5e3c;border-radius:4px}
.room .desk:after{content:"";position:absolute;left:6%;right:6%;top:100%;height:34px;background:#7a5234}
.room .me{position:absolute;left:44%;top:36%}.room .px{position:absolute;font-size:30px;line-height:1}
.room .chipx{position:absolute;left:12px;top:10px;background:rgba(255,255,255,.85);color:#4a3a5a;border-radius:12px;padding:2px 10px;font-size:12px}
.room .mas{position:absolute;right:14px;bottom:10px;font-size:34px}.room .say{position:absolute;right:56px;bottom:22px;max-width:56%;background:#fff;color:#3a2f4a;border-radius:14px;padding:6px 12px;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.room .bl{position:absolute;font-size:18px;opacity:.9}
.strm{max-height:560px;overflow-y:auto;padding-right:4px}

<style>
/* ===== v9-S 지하철 무대 (Another Station) ===== */
/* 한글: NEXON Lv2 Gothic(눈누 CDN, 상업적 무료). 영문·숫자 강조: Outfit(Google Fonts) */
@font-face{font-family:"NEXON Lv2 Gothic";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON%20Lv2%20Gothic.woff") format("woff");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"NEXON Lv2 Gothic";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/NEXON%20Lv2%20Gothic%20Bold.woff") format("woff");font-weight:700;font-style:normal;font-display:swap}
body,.se,textarea,button{font-family:"NEXON Lv2 Gothic","Noto Sans KR",sans-serif}
.se{font-weight:700}
.en{font-family:"Outfit","NEXON Lv2 Gothic","Noto Sans KR",sans-serif}
html,body{height:100%}
body.sw{margin:0;padding:0;background:#15181c;overflow:hidden;color:#1f2a2e}
#app{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;overflow:clip}
#stage{position:relative;width:1280px;height:800px;flex:none;overflow:hidden;overflow:clip;background:linear-gradient(#eef0ee 0,#e4e7e4 62%,#cfd3cf 62%,#c3c7c3 100%);font:14px/1.55 "NEXON Lv2 Gothic","Noto Sans KR",sans-serif;color:#1f2a2e;color-scheme:light;
 --mu:#6b7270;--ln:#d6dad6;--card:#fff;--ink:#1f2a2e;--bg:#f4f5f3;--ac:#a8467a;--g:#1f7a5c;--b:#b3312d;--gd:#b88a1e}
#stage *{box-sizing:border-box}
#stage .ceil{position:absolute;left:0;right:0;top:0;height:18px;background:linear-gradient(#cfd4d2,#e9ecea)}
#stage .lamp{position:absolute;top:4px;height:8px;border-radius:4px;background:#fffef6;box-shadow:0 0 18px 6px rgba(255,255,230,.55)}
#stage .floor{position:absolute;left:0;right:0;bottom:0;height:88px;background:repeating-linear-gradient(90deg,#b9bdb8 0 3px,#c6c9c4 3px 64px)}
#stage .wainscot{position:absolute;left:0;right:0;top:600px;height:6px;background:#aab0ad}
/* 벽·칸막이·봉 */
.sw-pole{position:absolute;width:12px;border-radius:6px;background:linear-gradient(90deg,#8f969a,#f4f6f7 45%,#9aa1a5);box-shadow:1px 0 2px rgba(0,0,0,.2)}
.sw-part{position:absolute;width:20px;background:linear-gradient(90deg,#f7f7f5,#e2e4e1);border:1px solid #cfd2ce;border-radius:4px}
/* 출입문 */
#door{position:absolute;left:452px;top:242px;width:376px;height:470px;background:#9da4a8;border:6px solid #b7bdc0;border-radius:6px 6px 0 0;overflow:hidden;box-shadow:inset 0 0 0 2px #868d91}
#plat{position:absolute;inset:0;background:linear-gradient(#e7e3d6 0,#e7e3d6 70%,#a7a294 70%,#8e897c 100%);overflow:hidden}
#plat .tiles{position:absolute;left:0;right:0;top:0;height:70%;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.05) 46px 48px),repeating-linear-gradient(0deg,transparent 0 46px,rgba(0,0,0,.05) 46px 48px)}
#plat .edge{position:absolute;left:0;right:0;top:70%;height:10px;background:repeating-linear-gradient(90deg,#f2c230 0 14px,#2a2a2a 14px 22px)}
#sign{position:absolute;left:50%;top:50px;transform:translateX(-50%);min-width:230px;padding:10px 16px;border-radius:6px;background:#fff;border:3px solid #333;text-align:center;font-weight:700;font-size:20px;color:#222;white-space:nowrap}
#sign small{display:block;font-size:12px;font-weight:500;color:#555}
#sign .bar{position:absolute;left:0;right:0;bottom:-3px;height:7px;border-radius:0 0 4px 4px}
.dp{position:absolute;top:0;width:182px;height:100%;background:linear-gradient(90deg,#c3c9cc,#e9ecee 40%,#cdd2d5);transition:transform 1.1s cubic-bezier(.6,0,.3,1);box-shadow:inset 0 0 0 1px #9aa1a5}
#dpL{left:0;border-right:2px solid #7d8488}#dpR{right:0;border-left:2px solid #7d8488}
#door.open #dpL{transform:translateX(-186px)}#door.open #dpR{transform:translateX(186px)}
.dp .win{position:absolute;left:40px;top:40px;width:102px;height:260px;border-radius:10px;border:5px solid #8a9195;overflow:hidden;background:#20242b}
.dp .stk{position:absolute;left:58px;top:322px;width:66px;padding:3px;border-radius:4px;background:#f6d53a;color:#333;font-size:9px;font-weight:700;text-align:center;line-height:1.2}
/* 창밖: 터널 / 지상 */
.out{position:absolute;inset:0}
.tunnel{background:#1c1f25}
.tunnel:before{content:"";position:absolute;inset:-20px 0;background:repeating-linear-gradient(180deg,transparent 0 60px,rgba(255,220,150,.55) 60px 64px,transparent 64px 140px);animation:tun 1.1s linear infinite}
@keyframes tun{to{transform:translateY(140px)}}
.ground{background:linear-gradient(#8fd0f7,#d8f1ff 70%,#bfe3c7 70%)}

.ground .cld{position:absolute;top:14%;left:0;width:300%;height:24px;background:radial-gradient(circle at 10% 50%,#fff 0 12px,transparent 13px),radial-gradient(circle at 14% 40%,#fff 0 16px,transparent 17px),radial-gradient(circle at 55% 50%,#fff 0 10px,transparent 11px),radial-gradient(circle at 58% 45%,#fff 0 14px,transparent 15px);animation:bld 22s linear infinite}
@keyframes bld{to{transform:translateX(-50%)}}
.ground .lbl{position:absolute;left:4px;top:4px;font-size:9px;background:rgba(255,255,255,.8);border-radius:6px;padding:0 5px;color:#2b5a3a}
.stopped .tunnel:before,.stopped .ground .bld,.stopped .ground .cld{animation-play-state:paused}
.flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 28px "Outfit","NEXON Lv2 Gothic","Noto Sans KR",sans-serif;color:#fff;text-shadow:0 0 8px #000;opacity:0;pointer-events:none}

.pl-card .btn{display:block;width:100%;margin-top:16px;padding:12px;border:0;background:#1f2a2e;color:#fff;font:700 16px "NEXON Lv2 Gothic","Noto Sans KR",sans-serif;border-radius:10px;cursor:pointer}
/* ===== 1단계: 폰 타임라인 ===== */
#tl .tli{padding:2px 0 6px}
#tl .tli.cont{padding-top:0}
#tl .tld{font:700 13px "NEXON Lv2 Gothic","Noto Sans KR",sans-serif;color:#26335a;margin:8px 0 4px;letter-spacing:-.2px}
#tl .tld .en{font-weight:700}
#tl .tli .ln{border-bottom:0;padding:2px 0}
#tl .tli.nw{animation:tlin .3s ease-out both,tlhl 1.5s ease both}
@keyframes tlin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes tlhl{0%,40%{background:rgba(255,214,90,.32)}100%{background:transparent}}
@media (prefers-color-scheme:dark){#tl .tld{color:#b9c6f2}}
#tlnew{position:absolute;top:168px;left:50%;transform:translateX(-50%);z-index:3;border:0;border-radius:16px;padding:5px 14px;background:var(--ac);color:#fff;font:700 12px "NEXON Lv2 Gothic","Noto Sans KR",sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}
#tlnew[hidden]{display:none}
#ntb{position:absolute;left:10px;right:10px;top:38px;z-index:7;display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:16px;background:rgba(40,34,52,.95);color:#fff;font-size:12.5px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3);transform:translateY(-140%);transition:transform .35s cubic-bezier(.3,0,.2,1)}
#ntb[hidden]{display:none}
#ntb.in{transform:none}#ntb b{font-size:13px}
#ntb svg{border-radius:50%;background:#fff;flex:none}
/* 친구 탭 */
.frl{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.frl .bd{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin-top:4px}.frl .bd i{display:block;height:100%;background:var(--ac)}
.frl button{border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-size:12px;padding:4px 10px;border-radius:14px;cursor:pointer;flex:none}
.frl button:disabled{opacity:.45;cursor:default}
details.dm{border-bottom:1px solid var(--ln);padding:6px 0}details.dm summary{cursor:pointer;font-size:13px}
.endlogo{font:700 22px "Outfit","NEXON Lv2 Gothic","Noto Sans KR",sans-serif;padding:14px 22px 0;color:var(--ac)}
#foot .en{font-weight:700}

const JEM={'대학생':'🏫','취준생':'👔','공시생':'📖','쉬는중':'🛋️','대기업':'🏢','스타트업':'💻','중견·중소':'🏭','프리랜서':'☕','공무원':'🏛️','창업':'🏪'};
const KIND={ach:'소식',daily:'일상',event:'모임',info:'정보'};
const EVC=[['동기들이랑 모임','🍻🎉'],['가족 생일','🎂👨‍👩‍👧'],['지역 행사 다녀옴','🎪🌆'],['오랜만에 동창 모임','🥂📸'],['등산 모임','⛰️🥾']];
const SERIAL={'공시생':['시험 D-30, 오늘도 출석','시험 D-7, 손이 떨려','시험 끝. 이제 결과를 기다려'],'취준생':['면접 시즌 1/3 시작','면접 2/3, 결과 기다리는 중','면접 시즌 끝. 해봤다는 게 중요해'],default:['새 도전 시작 🌱','중간 점검, 생각보다 힘들다','결과는 어땠을까, 일단 마무리']};
const SERE=['🌱','🔥','🎯'];
const QA=[['요즘 하루 중 제일 좋은 시간은?',['퇴근 직후','주말 아침','잠들기 전']],['요즘 나에게 제일 필요한 건?',['돈','휴식','사람']],['오늘 뭐 먹지?',['국밥','샐러드','치킨']],['최근에 가장 힘들었던 건?',['일·공부','사람','돈']],['다시 스무 살이 된다면?',['똑같이','다르게','모르겠다']]];
const POLLS=[['이번 연휴, 어디 갈까?',['여행','집콕']],['주말 약속 어때?',['번개 좋아','쉬고 싶어']],['이직 vs 존버?',['이직','존버']],['아침형 vs 저녁형?',['아침','저녁']]];
const ARC={down:[['{n}에게서 연락이 왔다. 「사실 요즘 많이 힘들어서… 잠깐 얘기해도 돼?」',{soc:3}],['{n}이(가) 만나자고 했다. 늦은 밤 편의점 앞에서 오래 이야기를 들었다.',{soc:6,burn:2,hp:1}],['{n}이(가) 스토리에 남겼다. 「고마워. 덕분에 다시 시작해보려고.」 마음이 따뜻해졌다.',{hp:4,self:3,soc:4}]],trip:[['{n}이(가) 여행 가자고 했다. 「이번엔 진짜로.」',{}],['여행 준비로 단톡방이 시끄럽다. 설레면서도 통장이 걱정된다.',{money:-3,hp:2}],['{n}과(와)의 여행에서 돌아왔다. 사진 속 우리는 다 웃고 있었다.',{soc:8,hp:5,burn:-6,money:-4}]]};
const CRPL={cong:'고마워 ㅎㅎ',envy:'에이 뭘ㅠ 나중에 얘기해',cheer:'힘이 된다 진짜',ask:'DM 보낼게!'};
function addStory(fi,type,o={}){const f=G.fr[fi],s=Object.assign({id:++G.sid,fi,type,born:G.m,exp:G.m+2,seen:0,bg:rr(0,5),o:++G.oc},o);f.stories.unshift(s);f.stories=f.stories.slice(0,4);return s}
function findStory(id){for(const f of G.fr)for(const s of f.stories)if(s.id==id)return s;return null}
function actS(){const a=[];G.fr.forEach(f=>f.stories.forEach(s=>{if(s.exp>=G.m)a.push(s)}));return a}
function startSerial(i,from){const f=G.fr[i];if(f.serUntil>G.m)return;f.serUntil=G.m+3;const a=SERIAL[f.job]||SERIAL.default;addStory(i,'serial',{t:a[0],e:SERE[0],part:1,of:3,from});G.sq.push({due:G.m+1,act:()=>addStory(i,'serial',{t:a[1],e:SERE[1],part:2,of:3})});G.sq.push({due:G.m+2,act:()=>addStory(i,'serial',{t:a[2],e:SERE[2],part:3,of:3})})}
function spawnOne(i){const f=G.fr[i];if(f.stories.filter(s=>s.exp>=G.m).length>=2)return;const r=R();
 if(r<.38){const s=R()<.7?ri(SNSL[f.job]):ri(GEN);addStory(i,'mood',{t:s[0],e:s[1]})}
 else if(r<.55){const q=ri(QA);addStory(i,'qa',{t:q[0],opts:q[1],e:'❓'})}
 else if(r<.72){const q=ri(POLLS);addStory(i,'poll',{t:q[0],opts:q[1],e:'🗳️'})}
 else if(r<.87&&f.bond>=45){const t=ri(TRUE[f.job]);addStory(i,'inner',{t:t[0],e:t[1]?'🌤️':'🌧️'})}
 else startSerial(i)}
function spawnStories(){G.fr.forEach((f,i)=>{f.stories=f.stories.filter(s=>{if(s.exp>=G.m)return true;if(!s.seen&&(s.type=='inner'||s.type=='serial')&&R()<.6){addLine(`${f.n}의 스토리를 보지 못하고 지나쳤다. 나중에 다른 친구에게서 들었다.`,'b',{soc:-1},'f',1,i);f.bond=clf(f.bond-2)}return false});if(!f.stories.length&&R()<.3)spawnOne(i)})}
function touch(fi){const f=G.fr[fi];f.ix=(f.ix||0)+1;if(f.ix>=3&&!f.arc&&f.bond>=40){f.arc=1;startArc(fi)}}
function startArc(fi){const f=G.fr[fi],k=R()<.5?'down':'trip',a=ARC[k];
 a.forEach((x,j)=>{G.sq.push({due:G.m+[1,3,5][j],t:x[0].replace(/\{n\}/g,f.n),tone:'g',fx:x[1],tag:'f',fi,w:4,after:j==2?()=>{if(k=='trip')genFeed(fi,null,'여행 다녀옴 ✈️','event');addStory(fi,'mood',{t:k=='trip'?'여행 끝, 우리 또 가자':'고마웠어. 이제 괜찮아',e:k=='trip'?'✈️🌅':'🫶'})}:null})});
 addLine(`${f.n}과(와)의 이야기가 이어지기 시작했다.`,'n',null,'u',2)}
function seedCms(fi){const o=G.fr.filter((x,i)=>i!=fi),a=['ㅋㅋㅋ','대박','오 멋지다','사진 잘 나왔네','부럽다ㅠㅠ','다음엔 나도 불러줘'];return Array.from({length:rr(0,2)},()=>({n:ri(o).n,t:ri(a)}))}
function doComment(pid,tn){const p=G.feed.find(x=>x.id==pid);if(!p||p.cm)return;p.cm=tn;const T=TONE[tn],fi=p.fi,f=G.fr[fi];
 addLine(`${f.n}의 게시물에 「${T[0].slice(2)}」 댓글을 남겼다.`,'q',T[1],'c',1.5);f.bond=clf(f.bond+T[2]);
 p.cms.push({n:'나',t:T[0],me:1});p.cms.push({n:f.n,t:CRPL[tn]});touch(fi);if(R()<.85)reply(fi,tn,p.k);
 const due=G.m+rr(1,2);
 if(tn=='cong')G.sq.push({due,act:()=>{addStory(fi,'mood',{t:'댓글 고마워 🥹 덕분에 힘났다',e:'🫶',from:'comment'});addLine(`${f.n}이(가) 내 댓글을 언급하며 스토리를 올렸다.`,'g',{soc:1},'f',2,fi);notiLast()}});
 else if(tn=='cheer')G.sq.push({due,act:()=>{startSerial(fi,'comment');addLine(`${f.n}이(가) 연재 스토리를 시작했다. 내 응원 덕분이라고 한다.`,'g',{soc:1},'f',2,fi);notiLast()}});
 else if(tn=='ask'&&p.k)G.sq.push({due,act:()=>{addStory(fi,'info',{t:`${POL[p.k].n}, 공식 사이트에서 직접 확인해봐`,e:'📄',from:'comment'});addRum(p.k,f.n)}});
 else G.sq.push({due,act:()=>{addStory(fi,'inner',{t:TRUE[f.job][0][0],e:'🌧️',from:'comment',reveal:1});addLine(`${f.n}이(가) 속마음 스토리를 올렸다. 내 댓글 이후의 이야기다.`,'n',{soc:2,self:2},'f',2,fi);notiLast()}});
 MOD=null;draw()}
function doStoryReply(sid,tn){const s=findStory(sid);if(!s||s.replied)return;s.replied=1;const f=G.fr[s.fi],T=TONE[tn];addLine(`${f.n}의 스토리에 답장했다. 「${T[0].slice(2)}」`,'q',T[1],'c',1.5);f.bond=clf(f.bond+T[2]);touch(s.fi);if(R()<.85)reply(s.fi,tn,null);draw()}
function answerStory(sid,i){const s=findStory(sid);if(!s||s.ans!=null)return;s.ans=i;const f=G.fr[s.fi],c=s.opts[i];f.bond=clf(f.bond+6);
 if(s.type=='poll')addLine(`${f.n}의 투표에 「${c}」를 골랐다. ${rr(35,78)}%가 같은 선택이었다.`,'q',{soc:1,hp:1},'c',1.2);
 else addLine(`${f.n}의 질문 스티커에 「${c}」라고 답했다.`,'q',{soc:2,hp:1},'c',1.2);
 touch(s.fi);G.sq.push({due:G.m+1,t:`${f.n}이(가) 내 답을 보고 메시지를 보냈다. 「ㅋㅋ ${c}? 의외다. 조만간 얘기 좀 하자.」`,tone:'g',fx:{soc:3},tag:'f',fi:s.fi,w:2});draw()}

function ctlHTML(){return `<div class="ctl"><button class="${G.paused?'on':''}" data-a="pause">${G.paused?'▶ 재개':'⏸ 멈춤'}</button>${[1,2,3,4].map(s=>`<button class="${!G.paused&&G.speed==s&&!FFN?'on':''}" data-a="sp:${s}">${[1,2,4,8][s-1]}×</button>`).join('')}<button data-a="ff">다음 갈림길까지 »</button><button class="${G.auto?'on':''}" data-a="auto">자동 결정</button><button data-a="diary">일기장</button><button data-a="home">나가기</button></div>`}
function tickBar(){return `<div class="ticks">${Array.from({length:20},(_,i)=>{const c=G.map[i],cur=i==G.age-20;return `<i class="${cur?'cur':''}" style="${c?`background:${moodCol(c.mood)}`:''}" data-a="yr:${i}" title="${20+i}세"></i>`}).join('')}</div>`}
function ringHTML(){let h=`<div class="stories"><button data-a="mys"><span class="ring me"><span class="pl">${G.mys&&G.mys.exp>=G.m?G.mys.mood:'＋'}</span></span>내 스토리</button>`;
 G.fr.forEach((f,i)=>{const a=f.stories.filter(s=>s.exp>=G.m),un=a.some(s=>!s.seen),sr=a.find(s=>s.type=='serial');h+=`<button data-a="fst:${i}"><span class="ring ${a.length?(un?'':'old'):'old dim'}">${av(f.cols,40)}</span>${f.n}${sr?`<span class="bdg">${sr.part}/${sr.of}</span>`:''}</button>`});return h+'</div>'}
function postHTML(p){const f=G.fr[p.fi],P=p.k&&POL[p.k];
 return `<div class="pcard"><div class="post"><button class="lnk" data-a="peer:${p.fi}">${av(f.cols,34)}</button><div style="flex:1"><b>${f.n}</b> <span class="kd">${KIND[p.kind]||'소식'}</span><div class="mu">${p.age}세 · ${f.job}</div></div></div><div class="ph" style="background:linear-gradient(135deg,${p.pc[0]},${p.pc[1]})">${p.e}</div><div style="font-size:14px;margin:4px 0">${esc(p.cap)}</div><div class="act"><button class="${p.liked?'on':''}" data-a="like:${p.id}">❤️ ${p.l+(p.liked?1:0)}</button><button class="${p.cm?'on':''}" data-a="cm:${p.id}">💬 ${p.cms.length}</button>${P&&!G.done[p.k]?`<button data-a="tip:${p.id}">🔎 알아보기</button>`:''}</div>${p.cms.slice(-3).map(c=>`<div class="cmt${c.me?' me':''}"><b>${esc(c.n)}</b> ${esc(c.t)}</div>`).join('')}</div>`}
function logHTML(l){const t=esc(l.t),meta=`${l.age}세 ${l.mo}월`;
 if(l.k=='f'&&l.fi!=null&&G.fr[l.fi]){const f=G.fr[l.fi];return `<div class="sf">${av(f.cols,34)}<div class="bub"><div class="mu">${f.n} · ${meta}</div>${t}</div></div>`}

 if(l.k=='u'||l.k=='me')return `<div class="sm2 ${l.tn}"><span class="em">🔔</span><div><div class="mu">${meta}</div>${t}</div></div>`;
 return `<div class="ln ${l.tn}"><span class="ag2">${meta}</span><span>${t}</span></div>`}
function decHTML(){const d=G.dec;if(!d)return'';return `<div class="dcd"><div class="mu" style="color:var(--ac)">갈림길 · ${d.age}세 ${d.mo}월</div><h3 class="se">${esc(d.t)}</h3><div class="mu" style="font-size:14px;margin-bottom:4px">${d.w&&d.w.length<9?`<b>${esc(d.w)}</b> · `:''}${esc(d.x)}</div>${d.e.ch.map((c,i)=>`<button class="cs ${lock(c)?'dis':''}" data-a="c:${i}"><i>${i+1}</i><span>${esc(c.t)}${lock(c)?`<small>🔒 ${Object.keys(c.need).map(k=>(k=='money'?'재정':LB[k])+' '+c.need[k]+' 이상 필요').join(', ')}</small>`:''}</span></button>`).join('')}<div class="ft"><button data-a="auto">이제부터 자동으로 맡기기</button></div></div>`}

 else if(k=='srs')startSr(+v);else if(k=='srp')srPick(+v);

 else if(k=='pol'){MOD={k:'pol',id:v,got:1};draw()}
 else if(k=='to'){LTO=v;draw()}
 else if(k=='lp'){const t=['고생 많았어.','네 속도로 가도 돼.','몰랐던 게 아니라 아무도 안 알려줬던 거야.'][+v],x=$('ltr');if(x)x.value=(x.value?x.value+' ':'')+t}
 else if(k=='lsave'){const t=(($('ltr')||{}).value||'').trim();if(!t)return tst('한 줄이라도 남겨보세요');const to=LTO=='me'?'5년 뒤의 나에게':`마흔의 ${G.me.n}에게`,L=lettersLocal();L.unshift({to,text:t,date:new Date().toLocaleDateString('ko-KR')});let ok=1;try{localStorage.setItem('al_letters',JSON.stringify(L.slice(0,20)))}catch(er){ok=0}
  if(typeof BE!='undefined')BE.saveLetter(to,t,ok);else tst(ok?'💌 편지를 저장했어요. 처음 화면의 편지함에서 볼 수 있어요':'이 환경에서는 저장되지 않아요. 복사해서 보관해주세요')}
});
window.addEventListener('error',e=>{const a=$('app');if(a)a.insertAdjacentHTML('afterbegin','<div class="pn">오류: '+e.message+'</div>')});
draw();
</script>
<script>
/* ===================================================================
 * Another Station (인생그램 v9-S) · 지하철 UI
 * 엔진(데이터·tickMonth·pickDecision·pickC·SNS·정책·검색·엔딩 로직)은 위 스크립트를 쓰고,
 * 화면 진입점 draw()만 지하철 장면으로 바꾼다. 엔진에 끼어들 때는 주로 함수를 감싼다
 * (setJob·tickMonth·startArc·loop·newGame). 클릭은 모두 기존 data-a 위임 처리기를 그대로 탄다.
 * =================================================================== */

const GAME_NAME = 'Another Station', ROUTE_NAME = '인생선', DEST_NAME = 'Another Life 행';

/* ---------- 나이 구간: 화면은 이 상수에서만 계산한다 ----------
 * 노선도는 20세역 ~ 36세 종점(역 17개, 한 역 = 1년)이다.
 * TODO(subway-conflict): 엔진은 아직 20세→40세(G.age=20+…, G.m>=240, 엔딩 「마흔 번째 생일」)로 돈다.
 *   36세역 도착 시 게임 종료는 2단계에서 엔진에 연결한다. 그 전까지 36세 이후에는 열차 표시가 종점에 머문다. */
const AGE_START = 20, AGE_END = 36;
const STATIONS = AGE_END - AGE_START + 1;   // 20, 21, …, 35, 36(종점) = 17개
const YEARS = AGE_END - AGE_START - 1;      // 기획 문구 「15년」
const TOTAL_M = (STATIONS - 1) * 12;        // 노선도 위 열차 위치 계산용(첫 역 → 종점)
const FIRST_MO = ((2 + 0) % 12) + 1;        // 엔진의 한 해 첫 달(mo() 기준). 2단계에서 1월 시작으로 바꾸면 따라간다.

const LINE_COL = {대학생:'#00A84D',취준생:'#00A5DE',공시생:'#747F00',쉬는중:'#A9A08A',대기업:'#0052A4',스타트업:'#E6186C','중견·중소':'#EF7C1C',프리랜서:'#996CAC',공무원:'#CD7C2F',창업:'#D4003B'};
const SPEED_NAME = ['', '완행', '급행', '특급', '직통'];
const W_LONG = 882, W_SHORT = 458, W_END = 870;
const lineCol = j => LINE_COL[j] || '#888';
const lineName = j => `${j}선`;

/* 나이 → 고유어 (스무, 마흔, 서른다섯 …) */
function ageWord(n, bare) {
  const T = ['', '열', '스물', '서른', '마흔', '쉰'], O = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉'];
  const O2 = ['', '한', '두', '세', '네', '다섯', '여섯', '일곱', '여덟', '아홉'];
  const t = Math.floor(n / 10), o = n % 10;
  if (bare) return (t === 2 && o === 0 ? '스물' : T[t]) + O[o];
  return (t === 2 && o === 0 ? '스무' : T[t]) + O2[o];
}

/* ---------- 픽셀 인물 ---------- */
const OUTFIT = {
  대학생: {top: null, hood: 1, pack: 1, pants: '#4a5a7a'},
  취준생: {top: '#2b3a67', collar: 1, pants: '#2b3a67'},
  공시생: {top: '#8a8f98', hood: 1, glasses: 1, pants: '#5a5f68'},
  쉬는중: {top: '#9ccf6a', stripe: '#fff', pants: '#9ccf6a', shoes: '#ffffff'},
  대기업: {top: '#26335a', collar: 1, lanyard: '#d8382f', badge: 1, pants: '#26335a'},
  스타트업: {top: '#222', cap: '#ff7fb0', badge: 1, pants: '#3a3a3a'},
  '중견·중소': {top: '#8ec5ea', badge: 1, lanyard: '#3a6fb0', pants: '#4a4f5a'},
  프리랜서: {top: '#d9c3a0', inner: '#fff', beanie: '#6b5b95', pants: '#5a4f45'},
  공무원: {top: '#f4f4f4', vest: '#2b3a67', badge: 1, pants: '#2b3a67'},
  창업: {top: null, apron: '#8b5a2b', pants: '#4a4a4a'},
};

function pixGrid(w, h) { return Array.from({length: h}, () => Array(w).fill(null)); }
function fill(g, x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && i >= 0 && i < g[j].length) g[j][i] = c; }
function svgOf(g, scale) {
  const h = g.length, w = g[0].length; let r = '';
  g.forEach((row, y) => row.forEach((c, x) => { if (c) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`; }));
  return `<svg width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}">${r}</svg>`;
}

/* 앞모습 인물. pose: 'sit'(16×26) | 'walk'(16×27) | 'stand'
 * opt: {cols, job, phone, sleep, hair, kid} */
function person(pose, opt) {
  const cols = opt.cols || ['#3b2a20', '#4a6fa5', '#fff'];
  const O = OUTFIT[opt.job] || {};
  const hair = opt.hair || cols[0], top = O.top || cols[1], pants = O.pants || '#4a5060';
  const skin = '#ffd9b5', eye = '#2b2340', shoe = O.shoes || '#2a2a2a';
  const sit = pose === 'sit', H = sit ? 26 : 27, g = pixGrid(16, H);
  const d = sit && opt.sleep ? 1 : 0; // 졸 때 머리를 한 칸 내린다
  // 머리
  fill(g, 4, 0 + d, 8, 1, hair); fill(g, 3, 1 + d, 10, 2, hair);
  fill(g, 4, 2 + d, 8, 4, skin); fill(g, 3, 2 + d, 1, 2, hair); fill(g, 12, 2 + d, 1, 2, hair);
  if (opt.sleep) { fill(g, 5, 4 + d - 1, 2, 1, eye); fill(g, 9, 4 + d - 1, 2, 1, eye); }
  else { fill(g, 6, 3 + d, 1, 1, eye); fill(g, 9, 3 + d, 1, 1, eye); }
  fill(g, 7, 5 + d, 2, 1, '#e05a7a');
  if (O.glasses) { fill(g, 5, 3, 3, 1, null); fill(g, 5, 2 + d, 3, 1, '#333'); fill(g, 8, 2 + d, 3, 1, '#333'); fill(g, 5, 4 + d, 3, 1, '#333'); fill(g, 8, 4 + d, 3, 1, '#333'); fill(g, 6, 3 + d, 1, 1, eye); fill(g, 9, 3 + d, 1, 1, eye); }
  if (O.cap) { fill(g, 3, 0 + d, 10, 2, O.cap); fill(g, 2, 2 + d, 12, 1, O.cap); }
  if (O.beanie) { fill(g, 3, 0 + d, 10, 2, O.beanie); fill(g, 3, 1 + d, 10, 1, '#8a7ab5'); }
  if (!d) fill(g, 6, 6, 4, 1, skin); // 목
  // 몸통
  fill(g, 3, 7, 10, 8, top);
  fill(g, 2, 8, 1, 6, top); fill(g, 13, 8, 1, 6, top); // 팔
  if (O.hood) fill(g, 4, 7, 8, 1, shade(top));
  if (O.collar) { fill(g, 6, 7, 1, 2, '#fff'); fill(g, 9, 7, 1, 2, '#fff'); fill(g, 7, 7, 2, 3, '#fff'); fill(g, 7, 8, 2, 1, '#c33'); }
  if (O.vest) { fill(g, 3, 8, 3, 7, O.vest); fill(g, 10, 8, 3, 7, O.vest); }
  if (O.inner) fill(g, 7, 7, 2, 8, O.inner);
  if (O.stripe) { fill(g, 2, 8, 1, 6, O.stripe); fill(g, 13, 8, 1, 6, O.stripe); }
  if (O.pack) { fill(g, 4, 7, 1, 8, '#7a4b2a'); fill(g, 11, 7, 1, 8, '#7a4b2a'); }
  if (O.apron || opt.job === '창업') { fill(g, 5, 9, 6, 6, O.apron || '#8b5a2b'); fill(g, 4, 8, 1, 1, O.apron || '#8b5a2b'); fill(g, 11, 8, 1, 1, O.apron || '#8b5a2b'); }
  if (O.lanyard) { fill(g, 6, 7, 1, 3, O.lanyard); fill(g, 9, 7, 1, 3, O.lanyard); fill(g, 7, 10, 2, 1, O.lanyard); }
  if (O.badge) fill(g, 7, 11, 2, 2, '#fff');
  if (sit) {
    if (opt.phone && !opt.sleep) { fill(g, 6, 10, 4, 4, '#3a3d42'); fill(g, 4, 12, 2, 2, skin); fill(g, 10, 12, 2, 2, skin); }
    else { fill(g, 1, 14, 2, 2, skin); fill(g, 13, 14, 2, 2, skin); }
    fill(g, 2, 15, 12, 2, pants);                // 허벅지(앞으로 짧게)
    fill(g, 3, 17, 3, 8, pants); fill(g, 10, 17, 3, 8, pants); // 정강이
    fill(g, 2, 25, 4, 1, shoe); fill(g, 10, 25, 4, 1, shoe);
    if (opt.phone && opt.sleep) fill(g, 6, 14, 4, 2, '#3a3d42'); // 무릎 위 휴대폰
  } else {
    fill(g, 2, 14, 1, 1, skin); fill(g, 13, 14, 1, 1, skin);
    fill(g, 4, 15, 3, 10, pants); fill(g, 9, 15, 3, 10, pants);
    fill(g, 3, 25, 4, 2, shoe); fill(g, 9, 25, 4, 2, shoe);
  }
  return svgOf(g, opt.scale || 5);
}
function shade(hex) {
  const n = parseInt(String(hex).replace('#', ''), 16); if (isNaN(n)) return hex;
  const r = Math.max(0, (n >> 16) - 40), g2 = Math.max(0, ((n >> 8) & 255) - 40), b = Math.max(0, (n & 255) - 40);
  return '#' + ((1 << 24) + (r << 16) + (g2 << 8) + b).toString(16).slice(1);
}
function catSvg() {
  const g = pixGrid(12, 9), c = '#2b2b33';
  fill(g, 1, 0, 1, 2, c); fill(g, 4, 0, 1, 2, c); fill(g, 1, 1, 4, 3, c); fill(g, 2, 2, 1, 1, '#ffd24a'); fill(g, 4, 2, 1, 1, '#ffd24a');
  fill(g, 3, 4, 7, 4, c); fill(g, 10, 2, 1, 4, c); fill(g, 3, 8, 1, 1, c); fill(g, 8, 8, 1, 1, c);
  return svgOf(g, 4);
}

/* ---------- 상태 ---------- */
const UI = {
  built: false, g: null, busy: false, mode: 'start', boarding: false, allowBegin: false,
  riders: {}, meKey: '', lastAge: null, lastDec: null, ledMsg: '', xfQ: [], ending: false, endShown: false,
  tlScroll: 0, tlSeen: null, tlNew: 0, ledHold: -1, ntBusy: false, starting: false, allowNew: false,
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
// 직통에서만 연출을 생략한다(완행·급행·특급은 항상 연출).
const fast = () => !!G && G.speed === 4;
const $s = id => document.getElementById(id);

/* ---------- 무대 만들기 (한 번만) ---------- */
function buildStage() {
  if (UI.built) return;
  document.body.classList.add('sw');
  const app = $('app');
  const lamps = [60, 330, 620, 900, 1160].map(x => `<i class="lamp" style="left:${x}px;width:120px"></i>`).join('');
  app.innerHTML = `<div id="stage">
    <div class="ceil">${lamps}</div><div class="wainscot"></div><div class="floor"></div>
    <div class="sw-part" style="left:426px;top:222px;height:400px"></div><div class="sw-pole" style="left:440px;top:18px;height:690px"></div>
    <div class="sw-part" style="left:832px;top:222px;height:400px"></div><div class="sw-pole" style="left:836px;top:18px;height:690px"></div>
    <div id="door"><div id="plat"><div class="tiles"></div><div class="edge"></div><div id="sign"></div></div>
      <div class="dp" id="dpL"><div class="win"><div class="out tunnel"></div><div class="flash"></div></div><div class="stk">기대지<br>마세요</div></div>
      <div class="dp" id="dpR"><div class="win"><div class="out tunnel"></div><div class="flash"></div></div><div class="stk">손 끼임<br>주의</div></div></div>
    <div class="seatback" style="left:16px;width:410px"></div><div class="seat" style="left:16px;width:410px"></div>
    <div class="seatback" style="left:850px;width:430px"></div><div class="seat" style="left:850px;width:430px"></div>
    <div id="emg"><div class="st">비상시<br>문 여는<br>방법</div><div class="bx">비상<br>인터폰<i></i></div><div class="sn">손<br>소독</div></div>
    <div id="people"></div>
    <div id="ctl" class="off"></div>
    <div id="card"></div>
    ${platformHTML()}
    <div id="route" class="long"><div class="box"><div class="hd"></div><div class="mapw"></div></div><div id="led"><span></span></div></div>
    <div id="hero"></div>
    <div id="phone" class="down"><div id="scr">
      <div class="sb0"></div><div class="apph"></div><div class="rings"></div><div id="tl"></div>
      <button id="tlnew" type="button" hidden></button>
      <div class="nav"></div><div id="noti" hidden></div><div id="ntb" hidden></div><div id="shade"></div>
      <div id="sheet"><div class="grab"></div><div id="shb"></div></div><div id="splash">${GAME_NAME}</div></div>
      <i class="hand" style="left:-14px;top:300px"></i><i class="hand" style="left:-14px;top:350px"></i><i class="hand" style="left:-14px;top:400px"></i><i class="hand" style="right:-14px;top:330px;height:48px"></i></div>
    <div id="endp" hidden></div>
    <div id="sun"></div><div id="dim"></div>
    <div id="foot"><b class="en">${GAME_NAME}</b> · ※ 이벤트·정책은 프로토타입용 예시입니다. 실제 대상·조건·금액은 온통청년·복지로·고용24·정부24에서 확인하세요.</div>
    <div id="block"></div></div>`;
  UI.built = true;
  fitStage(); addEventListener('resize', fitStage);
  $s('tlnew').addEventListener('click', () => { const tl = $s('tl'); tl.scrollTo({top: 0, behavior: 'smooth'}); UI.tlNew = 0; $s('tlnew').hidden = true; });
  $s('tl').addEventListener('scroll', () => { if ($s('tl').scrollTop < 8) { UI.tlNew = 0; $s('tlnew').hidden = true; } });
}

/* ---------- 시작 화면: 지하철 역 승강장 (CSS·픽셀로 직접 그림) ---------- */
function platformHTML() {
  const lights = Array.from({length: 7}, (_, i) => `<i class="pl-lamp" style="left:${40 + i * 180}px"></i>`).join('');
  const panes = Array.from({length: 8}, (_, i) => {
    const x = 16 + i * 156, mid = i === 3 || i === 4;
    return `<div class="psd${mid ? ' gate' : ''}${i === 3 ? ' gl' : ''}${i === 4 ? ' gr' : ''}" style="left:${x}px">${mid ? '<span>타는 곳</span>' : ''}</div>`;
  }).join('');
  return `<div id="plt" hidden>
    <div class="pl-ceil">${lights}</div><div class="pl-wall"></div>
    <div class="pl-track"><div id="pl-train"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="pl-doors">${panes}</div>
    <div class="pl-floor"><div class="pl-safe"></div><div class="pl-dots"></div></div>
    <div class="pl-name"><small>${ROUTE_NAME}</small><b>${AGE_START}세역</b><div class="nx">다음 역 <b class="en">${AGE_START + 1}</b>세 →</div><i class="bar"></i></div>
    <div class="pl-arr"><span>열차 도착 안내</span><b>${DEST_NAME} · 곧 도착합니다</b></div>
    <div class="pl-card" id="plc"></div>
  </div>`;
}

/* 창 크기에 맞추기: zoom(화질 유지) → 지원하지 않으면 scale */
function fitStage() {
  const st = $s('stage'); if (!st) return;
  const k = Math.min(innerWidth / 1280, innerHeight / 800);
  if (CSS && CSS.supports && CSS.supports('zoom', '1')) { st.style.zoom = k; st.style.transform = ''; }
  else { st.style.transform = `scale(${k})`; st.style.transformOrigin = '50% 50%'; }
}

/* ---------- 노선도 ---------- */
const sx = i => `calc(34px + (100% - 68px) * ${i / (STATIONS - 1)})`;      // 역 i의 x
const mx = m => `calc(34px + (100% - 68px) * ${Math.min(m, TOTAL_M) / TOTAL_M})`; // 개월 m의 x

function setRouteWidth(kind) {
  const r = $s('route'); r.classList.toggle('long', kind === 'long'); r.classList.toggle('end', kind === 'end');
}

function routeHTML() {
  const g = G, curI = g ? Math.min(g.age, AGE_END) - AGE_START : -1;
  // 노선 선: 같은 직업이 이어지는 구간마다 그 노선 색
  let segs = '';
  if (g && g.jobAt) {
    let s = 0, j = g.jobAt[0] || g.job;
    for (let m = 1; m <= g.m + 1; m++) {
      const jm = m <= g.m ? (g.jobAt[m] || j) : null;
      if (jm !== j) { segs += `<i class="seg" style="left:${mx(s)};width:calc(${mx(m)} - ${mx(s)});background:${lineCol(j)}"></i>`; s = m; j = jm; }
    }
  }
  const st = Array.from({length: STATIONS}, (_, i) => {
    const age = AGE_START + i, c = g && g.map[i], cur = i === curI;
    const col = c ? moodCol(c.mood) : '';
    const tip = c ? `${c.age}세 · ${String(c.t).replace(/"/g, '')}` : `${age}세`;
    const last = i === STATIONS - 1;
    return `<i class="st${cur ? ' cur' : ''}${last ? ' end' : ''}" style="left:${sx(i)};${col ? `background:${col};border-color:${col}` : ''}${cur && g ? `;border-color:${lineCol(g.job)}` : ''}" ${g ? `data-a="yr:${i}"` : ''} title="${tip}"><em>${last ? `${age} <small>종점</small>` : age}</em></i>`;
  }).join('');
  const xf = g && g.xf ? g.xf.map(x => `<i class="xf" style="left:${mx(x.m)};border-color:${lineCol(x.to)}" title="${AGE_START + Math.floor(x.m / 12)}세 · ${x.from} → ${x.to} 환승"></i>`).join('') : '';
  const trn = g ? `<i class="trn" style="left:${mx(g.m)};background:${lineCol(g.job)}"></i>` : '';
  return `<div class="base"></div>${segs}${st}${xf}${trn}`;
}

function routeHead() {
  if (!G || S === 'start' || S === 'pro' || UI.boarding) {
    return `<span class="badge" style="background:#3a3f47">${DEST_NAME}</span><span class="subt">${AGE_START}세 → ${AGE_END}세 종점 · 한 역 = 1년</span>`;
  }

  return `<span class="badge" style="background:${lineCol(j)}">${lineName(j)}</span><span class="nx">${nx}</span>`;
}

/* ---------- LED ---------- */
function led(msg) {
  if (!msg || msg === UI.ledMsg) return;
  UI.ledMsg = msg;
  const box = $s('led'), sp = box.querySelector('span');
  sp.textContent = msg;
  const w = box.clientWidth || W_SHORT, tw = sp.scrollWidth || msg.length * 14;

async function alight(html, x) { const el = await walk(html, {x, y: SEAT_Y, s: 1}, {x: DOOR_X, y: DOOR_BOTTOM, s: .5}, 1100); el.style.opacity = 0; await sleep(400); el.remove(); }
async function board(html, x) { const el = await walk(html, {x: DOOR_X, y: DOOR_BOTTOM, s: .5}, {x, y: SEAT_Y, s: 1}, 1100); el.remove(); }

async function withBusy(fn) {
  UI.busy = true; $s('stage').classList.add('busy'); setOutside();
  try { await fn(); } catch (e) { console.error(e); }
  UI.busy = false; $s('stage').classList.remove('busy'); setOutside();
}

/* 탑승 연출 → 끝나면 엔진의 begin을 그대로 실행 */
async function runBoarding() {
  UI.boarding = true; draw();
  await withBusy(async () => {
    const g = G, j = g.job;
    setSign(`${AGE_START}세역`, `${lineName(j)} · 시발역`, lineCol(j)); led(`${AGE_START}세역입니다 · ${lineName(j)} 열차가 들어옵니다`);
    doors(true); await sleep(1200);
    await board(walkerOf(g.me.cols, j), 312);
    UI.boarding = false; placeMe(true); placeRiders(wantRiders());
    doors(false); await sleep(1100);
    const ph = $s('phone'); ph.classList.remove('down'); ph.classList.add('lift');
    setRouteWidth('short');
    await sleep(900); ph.classList.remove('lift'); $s('splash').classList.add('gone');
  });
  UI.allowBegin = true;
  const b = document.createElement('button'); b.dataset.a = 'begin'; b.hidden = true; document.body.appendChild(b); b.click(); b.remove();
  UI.allowBegin = false;
  addLine('지하철 자리에 앉아 휴대폰을 켰다.', 'n');
  led(defaultLed()); draw();
}

/* 환승 · 승객 변화를 한 번의 정차로 묶는다 */
async function runStop(xf, want) {
  await withBusy(async () => {
    const g = G, prev = UI.riders, wantNow = want;
    const leave = Object.keys(prev).filter(k => !wantNow[k]), come = Object.keys(wantNow).filter(k => !prev[k]);
    const fromJ = xf ? xf.from : g.job, toJ = xf ? xf.to : g.job, age = AGE_START + Math.floor(g.m / 12);
    setSign(`${age}세역`, xf ? `환승역 · ${lineName(toJ)} 갈아타는 곳` : `${lineName(fromJ)}`, lineCol(fromJ));
    led(xf ? `이번 역은 ${age}세역, 환승역입니다 · ${lineName(toJ)}으로 갈아타실 분은 이번 역에서 내리세요` : `이번 역은 ${age}세역입니다`);
    doors(true); await sleep(1100);
    // 내릴 사람
    for (const k of leave) { const r = prev[k], el = document.querySelector(`[data-r="${k}"]`); if (el) el.remove(); if (!r.cat) await alight(walkerOf(r.cols, null, r.hair), r.x); }
    if (xf) {
      // 환승: 나와 남은 승객이 모두 내렸다가, 새 노선 열차에 다시 탄다
      const stay = Object.keys(wantNow).filter(k => prev[k]);
      $s('me') && $s('me').remove(); UI.meKey = '';
      await alight(walkerOf(g.me.cols, fromJ), 312);
      for (const k of stay) { const r = prev[k], el = document.querySelector(`[data-r="${k}"]`); if (el) el.remove(); if (!r.cat) await alight(walkerOf(r.cols, null, r.hair), r.x); }
      doors(false); led(`${lineName(toJ)}으로 갈아타는 중…`); UI.riders = {}; UI.xfColor = toJ; renderStatic(); await sleep(1300);
      setSign(`${age}세역`, `${lineName(toJ)} · 환승`, lineCol(toJ)); doors(true); await sleep(1100);
      await board(walkerOf(g.me.cols, toJ), 312); placeMe(true);
      for (const k of stay.concat(come)) { const r = wantNow[k]; if (!r.cat) await board(walkerOf(r.cols, null, r.hair), r.x); UI.riders[k] = r; $s('people').insertAdjacentHTML('beforeend', riderHTML(r)); }
      UI.xfColor = null;
    } else {
      for (const k of come) { const r = wantNow[k]; if (!r.cat) await board(walkerOf(r.cols, null, r.hair), r.x); }
      placeRiders(wantNow);
    }
    placeRiders(wantNow);
    doors(false); await sleep(1100);
    led(`이번 열차는 ${lineName(g.job)}, ${AGE_END}세 행입니다`);
  });
  draw(); if (S === 'play') loop();
}

/* 종착역 */
async function runEnding() {
  UI.ending = true;
  await withBusy(async () => {
    const g = G;
    $s('phone').classList.add('down');
    setSign(`${AGE_END}세역`, '종착역', '#d8382f'); led(`이번 역은 종착역, ${ageWord(AGE_END, true)} 역입니다 · 두고 내리는 물건이 없는지 확인하세요`);
    await sleep(900); doors(true); await sleep(1100);
    const meEl = $s('me'); if (meEl) meEl.remove();
    await alight(walkerOf(g.me.cols, g.job), 312);
    for (const k of Object.keys(UI.riders)) { const r = UI.riders[k], el = document.querySelector(`[data-r="${k}"]`); if (el) el.remove(); if (!r.cat) await alight(walkerOf(r.cols, null, r.hair), r.x); }
    UI.riders = {};
    setRouteWidth('end'); await sleep(900);
  });
  UI.endShown = true; draw();
}

/* ---------- 장면 초기화 (새 인생·처음으로) ---------- */
function resetScene() {
  UI.g = G; UI.riders = {}; UI.meKey = ''; UI.lastAge = null; UI.lastDec = null; UI.ending = false; UI.endShown = false; UI.xfQ = []; UI.ledMsg = '';
  UI.ledHold = -1; UI.tlSeen = null; UI.tlBorn = null; UI.tlNew = 0;
  if ($s('tlnew')) $s('tlnew').hidden = true;
  $s('people').innerHTML = ''; doors(false); setRouteWidth('long');
  const ph = $s('phone'); ph.classList.add('down'); $s('splash').classList.remove('gone');
  const ep = $s('endp'); ep.hidden = true; ep.innerHTML = '';
  setSign('', '', '#555');
}

/* 열차 상태와 무관하게 늘 그리는 부분 */
function renderStatic() {
  const lineJ = UI.xfColor || (G && G.job);
  $s('ctl').innerHTML = ctlHTML2(); $s('ctl').classList.toggle('off', !(G && S === 'play'));
  $s('route').querySelector('.hd').innerHTML = routeHead();
  $s('route').querySelector('.mapw').innerHTML = routeHTML();
  if (lineJ && S === 'play') { const b = $s('route').querySelector('.badge'); if (b) { b.style.background = lineCol(lineJ); b.textContent = lineName(lineJ); } }
}

/* ===================== draw(): 화면 진입점 ===================== */
draw = function () {
  buildStage();
  if (S === 'form') S = 'start'; // 「내 인생에 적용해보기」는 지하철 UI에서 쓰지 않는다(메모 C5). 엔진 코드는 그대로 둔다.
  if (G !== UI.g) resetScene();
  const hero = $s('hero'), card = $s('card'), endp = $s('endp');
  renderStatic();
  setOutside();

  const adCard = () => { card.className = 'ad'; card.innerHTML = `<div class="big">이 자리에<br>당신이 살아볼<br><span class="en">${YEARS}</span>년이 실립니다</div><div class="mu" style="margin-top:10px">${ROUTE_NAME} · ${AGE_START}세 → ${AGE_END}세 종점</div>`; };
  $s('plt').hidden = !(S === 'start' || !G || UI.starting);
  $s('emg').style.visibility = S === 'pro' && !UI.boarding ? 'hidden' : ''; // 첫 페이지 패널 뒤로 비치지 않게

  if (S === 'start' || !G) {
    // 시작 화면: 차내 대신 승강장을 보여 주고, 가운데 카드만 띄운다.
    hero.className = 'hide';
    if (!UI.starting) $s('plc').innerHTML = heroStart();
    adCard();
    led(departLed());
    return;
  }

  if (S === 'pro') {
    // 첫 페이지: 왼쪽은 광고 카드 그대로, 노선도 아래에 넓은 패널 하나
    adCard();
    hero.className = UI.boarding ? 'hide' : 'pro'; if (!UI.boarding) hero.innerHTML = heroPro();
    if (!UI.boarding) led(departLed());
    return;
  }
  card.className = ''; card.innerHTML = cardHTML();
  hero.className = 'hide';

  if (S === 'end') {
    if (!UI.ending && !UI.endShown) { runEnding(); return; }
    if (UI.endShown) {
      endp.hidden = false;
      const st = endp.scrollTop;
      const lines = [];
      if (G.jobAt) { let j = null; for (let m = 0; m <= G.m; m++) { const jm = G.jobAt[m] || j; if (jm && jm !== j) { lines.push(`<span style="background:${lineCol(jm)}">${lineName(jm)} · ${AGE_START + Math.floor(m / 12)}세 ${j ? '환승' : '출발'}</span>`); j = jm; } } }
      keepInputs(() => {
        endp.innerHTML = `<div class="endlogo en">${GAME_NAME}</div><div class="lines"><b style="margin-right:6px">타고 온 노선</b>${lines.join('')}</div>` + vEnd().replace('마흔 번째 생일', '종착역 · 마흔 번째 생일');
      });
      endp.scrollTop = st;
    }
    return;
  }

  // ---- 운행 중 ----
  if (!UI.busy) placeMe(false);
  renderPhone();
  if (UI.lastAge !== null && G.age !== UI.lastAge && !UI.busy) {
    // 해가 바뀔 때: 서기만 하고 문은 열지 않는다
    flashAge(G.age);
    led(`이번 역은 ${G.age}세역입니다 · 내리실 문은 없습니다 · 다음 역은 ${G.age + 1}세역`);
    // 정차가 끝나면 반드시 다시 그린다. 그사이 결정 창이 떠서 loop가 그리지 않더라도 대기 중인 환승을 놓치지 않는다.
    if (!fast()) withBusy(() => sleep(900)).then(() => { if (S === 'play') { draw(); loop(); } });
  } else if (!UI.busy && !UI.ledMsg.startsWith('이번 역은') && G.m >= UI.ledHold) led(defaultLed());
  UI.lastAge = G.age;

  // 환승·승객 변화: 결정 창이나 다른 창이 열려 있으면 닫은 뒤에 연출한다(큐는 그대로 둔다).
  const sheetOpen = !!MOD || (G.dec && !G.dec.hid);
  if (!UI.busy && !UI.boarding && !sheetOpen) {
    const want = wantRiders(), xf = UI.xfQ.shift() || null;
    const diff = Object.keys(want).some(k => !UI.riders[k]) || Object.keys(UI.riders).some(k => !want[k]);
    if (xf || diff) {
      if (fast()) {
        // 직통: 연출 없이 색·옷차림만 바꾸고 LED 한 줄로 안내한다.
        placeMe(true); placeRiders(want);
        if (xf) { led(`${AGE_START + Math.floor(xf.m / 12)}세역 환승 · ${lineName(xf.from)} → ${lineName(xf.to)} · 이번 열차는 ${lineName(xf.to)}, ${AGE_END}세 행입니다`); UI.ledHold = G.m + 3; }
      }
      else { runStop(xf, want); return; }
    }
    // 이름표 갱신(연인 → 배우자)
    Object.keys(want).forEach(k => { if (UI.riders[k] && want[k].tag && UI.riders[k].tag !== want[k].tag) { UI.riders[k].tag = want[k].tag; const t = document.querySelector(`[data-r="${k}"] .tag`); if (t) t.textContent = want[k].tag; } });
  }
};

/* ===================== 엔진 감싸기 ===================== */
const _setJob = setJob;
setJob = function (j) {
  const g = G;
  if (g && g.job !== j) { (g.xf = g.xf || []).push({m: g.m, from: g.job, to: j}); UI.xfQ.push({m: g.m, from: g.job, to: j}); }
  return _setJob.apply(this, arguments);
};
const _tickMonth = tickMonth;
tickMonth = function () {
  const r = _tickMonth.apply(this, arguments);
  const g = G;
  if (g) {
    g.jobAt = g.jobAt || [];
    g.jobAt[g.m] = g.job;
    if (g.f.care && g.careAt == null) g.careAt = g.m;
  }
  return r;
};
const _startArc = startArc;
startArc = function (fi) {
  if (G) G.ride = {fi, from: G.m + 1, to: G.m + 6};
  return _startArc.apply(this, arguments);
};
/* TODO(subway-conflict): 자동결정·직통 중 소문 갈림길에서 「바로 검색해본다」가 뽑히면 검색 창(MOD 'sr')에서 열차가 선다(메모 B5).
 *   v8-C와 같은 동작이고 엔진(makeDec 자동 선택)은 건드리지 않았다. 검색 선택지를 빼거나 「메모만」을 고르게 할지는 나중에 정한다.
 * TODO(subway-conflict): v8-C 방 장면(roomHTML)의 마스코트 말풍선 안내(소문 도착·지쳐 보임·안부 권유)는 지하철 UI에 자리가 없다(메모 A4).
 *   LED 전광판이나 폰 알림으로 옮길지 정해야 한다. roomHTML() 코드는 그대로 남겨 두었다.
 * TODO(subway-conflict): 무대는 1280×800 고정이라 휴대폰 화면에서는 아주 작게 보인다(메모 B3). index.html은 v9-S를 가리킨다.
 * TODO(subway-conflict): 차내는 밝은 색 고정, 휴대폰 화면 안쪽과 엔딩 패널만 시스템 다크 모드를 따른다(메모 B4). */
const _loop = loop;
loop = function () {
  if (UI.busy) { clearTimeout(TM); TM = setTimeout(loop, 250); return; }
  return _loop.apply(this, arguments);
};
const _newGame = newGame;
newGame = function () {
  const r = _newGame.apply(this, arguments);
  if (G) { G.jobAt = [G.job]; G.xf = []; }
  return r;
};

/* 시작 화면 → 첫 페이지 전환: 승강장에 열차가 들어와 문이 열리고 차내로 넘어간다(약 1.3초). */
async function runStart() {
  UI.starting = true;
  await withBusy(async () => {
    const plt = $s('plt');
    plt.classList.add('arrive'); await sleep(650);   // 열차 도착
    plt.classList.add('open'); await sleep(350);     // 스크린도어·열차 문 열림
    plt.classList.add('fade'); await sleep(350);     // 차내로
  });
  UI.allowNew = true;
  const b = document.createElement('button'); b.dataset.a = 'new:other'; b.hidden = true; document.body.appendChild(b); b.click(); b.remove();
  UI.allowNew = false;
  UI.starting = false; $s('plt').classList.remove('arrive', 'open', 'fade'); draw();
}

/* begin(탑승)·시작 화면의 new:other는 capture 단계에서 가로채 연출 뒤에 엔진 처리를 그대로 실행한다. 연출 중 다른 클릭은 막는다. */
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-a]');
  if (UI.busy && e.target.closest && e.target.closest('#stage')) { e.stopPropagation(); e.preventDefault(); return; }
  if (t && t.dataset.a === 'begin' && !UI.allowBegin) {
    e.stopPropagation(); e.preventDefault();
    if (S === 'pro' && !UI.boarding) runBoarding();
  }
  if (t && t.dataset.a === 'new:other' && S === 'start' && !UI.allowNew) {
    e.stopPropagation(); e.preventDefault();
    if (!UI.starting) runStart();
  }
}, true);

draw();
</script>

<script>
/* 플레이 기록 호환: 백엔드 schemas.py의 PlayIn.variant는 A/B/C만 받는다(메모 C4).
 * 백엔드 계약을 바꾸지 않고, 저장할 때만 기준 버전 값(C)으로 바꿔 보낸다.
 * TODO(subway-conflict): 백엔드가 "S"를 받게 되면 이 매핑을 지워 v9-S 기록을 따로 모은다. */
(() => {
  if (typeof BE === 'undefined' || typeof BE.savePlay !== 'function') return;
  const API_VARIANT = 'C', save = BE.savePlay;
  BE.savePlay = function () { const v = VARI; VARI = API_VARIANT; try { return save.apply(this, arguments); } finally { VARI = v; } };
})();
</script>
